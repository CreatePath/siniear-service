[project]
name = "siniear-service"
version = "0.1.0"
description = "Siniear Service backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
