name: siniear

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-siniear}
      POSTGRES_USER: ${DB_USER:-siniear}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: local

  service:
    build:
      context: .
      target: development
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-siniear}
      DB_USER: ${DB_USER:-siniear}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
      WATCHFILES_FORCE_POLLING: "true"
      APP_ENV: development
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
      INTERVIEW_PROVIDER: ${INTERVIEW_PROVIDER:-fake}
      GEMINI_INTERVIEW_MODEL: ${GEMINI_INTERVIEW_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      KAKAO_APP_ID: ${KAKAO_APP_ID:-0}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    ports:
      - "127.0.0.1:${SERVICE_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./migrations:/app/migrations:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=7)"]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 20s
    init: true
    logging:
      driver: local

  title-push:
    profiles: ["push"]
    build:
      context: .
      target: runtime
    command: ["python", "-m", "app.workers.title_push"]
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-siniear}
      DB_USER: ${DB_USER:-siniear}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/fcm_credentials
    secrets: [fcm_credentials]
    depends_on:
      db:
        condition: service_healthy

secrets:
  fcm_credentials:
    file: ${FCM_CREDENTIALS_FILE:-../.local/fcm-credentials.json}

volumes:
  postgres-data:
